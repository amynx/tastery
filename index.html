<!doctype html>
<html data-theme="lemonade" lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <!--CSS-->
    <link rel="stylesheet" href="src/styles/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!--Scripts-->
    <script type="module" src="/src/main.js" defer></script>
    <title>Tastery</title>
  </head>
  <body>
    <!-- ========================================================================================= -->
    <!-- @section Navbar -->
    <!-- @description
     Main navigation bar for the Tastery web application.
     It contains the logo, a search bar, and main action buttons.
     Behavior by screen size:
       - Desktop (md and up): logo on the far left, search bar near the logo (not too close), 
         and buttons aligned to the far right.
       - Tablet and mobile (sm and below): the search bar and full-size buttons are hidden.
         Compact icon buttons appear instead, and the “Add Recipe” action becomes a Floating Action Button (FAB).
-->
    <!-- @responsive
     - md and up: full navbar layout visible.
     - sm and below: compact mobile layout with icons and FAB.
-->
    <!-- ========================================================================================= -->

    <nav class="navbar bg-base-200">
      <!-- ======================== LOGO ======================== -->
      <!-- @element Logo -->
      <!-- @description
       Displays the application icon and title “Tastery”.
       It remains anchored to the far-left side of the navbar.
  -->
      <div class="ps-4 flex items-center gap-2">
        <i data-lucide="chef-hat"></i>
        <a class="text-lg font-bold uppercase">Tastery</a>
      </div>

      <!-- ======================== SEARCH BAR ======================== -->
      <!-- @element SearchBar -->
      <!-- @description
       Centered search input located slightly away from the logo (not too close).
       Visible only on desktop and larger screens.
  -->
      <label class="input hidden md:flex items-center gap-2 ml-8">
        <svg class="h-[1em] opacity-50" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
          <g
            stroke-linejoin="round"
            stroke-linecap="round"
            stroke-width="2.5"
            fill="none"
            stroke="currentColor"
          >
            <circle cx="11" cy="11" r="8"></circle>
            <path d="m21 21-4.3-4.3"></path>
          </g>
        </svg>
        <input type="search" required placeholder="Search" />
      </label>

      <!-- ======================== ACTIONS ======================== -->
      <!-- @element Actions -->
      <!-- @description
       Right-aligned container for primary action buttons.
       On desktop: full-size “Add Recipe” and “Saved Recipes” dropdown.
       On mobile: replaced with compact icons and a FAB.
  -->
      <div class="flex grow justify-end px-2">
        <div class="hidden md:flex items-stretch">
          <!-- Add Recipe Button -->
          <a class="btn btn-ghost rounded-field uppercase">
            <i data-lucide="plus"></i>
            Add Recipe
          </a>

          <!-- Saved Recipes Dropdown -->
          <div class="dropdown dropdown-end">
            <div tabindex="0" role="button" class="btn btn-ghost rounded-field uppercase">
              <i data-lucide="bookmark"></i>
              Saved
            </div>
            <ul
              tabindex="-1"
              class="menu dropdown-content bg-base-200 rounded-box z-10 mt-4 w-52 p-2 shadow-sm"
            >
              <li><a>Recipe 1</a></li>
              <li><a>Recipe 2</a></li>
            </ul>
          </div>
        </div>
      </div>

      <!-- ======================== MOBILE ACTIONS ======================== -->
      <!-- @element MobileActions -->
      <!-- @description
       Compact icon buttons that replace the search bar and dropdown on smaller screens.
       Includes a search icon and a saved recipes icon (dropdown preserved).
  -->
      <div class="flex md:hidden gap-2 pe-4 items-center">
        <!-- Search Icon Button -->
        <button class="btn btn-ghost btn-sm" aria-label="Search">
          <i data-lucide="search"></i>
        </button>

        <!-- Saved Recipes Dropdown (Compact Version) -->
        <div class="dropdown dropdown-end">
          <button
            tabindex="0"
            role="button"
            class="btn btn-ghost btn-sm"
            aria-label="Saved Recipes"
          >
            <i data-lucide="bookmark"></i>
          </button>
          <ul
            tabindex="-1"
            class="menu dropdown-content bg-base-200 rounded-box z-10 mt-2 w-48 p-2 shadow-sm"
          >
            <li><a>Recipe 1</a></li>
            <li><a>Recipe 2</a></li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- ======================== FLOATING ACTION BUTTON ======================== -->
    <!-- @element FAB -->
    <!-- @description
     Floating Action Button for adding new recipes.
     Visible only on mobile and tablet screens.
     Positioned above all elements using fixed placement and high z-index.
-->
    <div class="fixed bottom-6 right-6 md:hidden z-50">
      <button class="btn btn-primary btn-circle shadow-lg" aria-label="Add Recipe">
        <i data-lucide="plus"></i>
      </button>
    </div>

    <!-- ========================================================================================= -->
    <!-- @section SearchResultsGrid -->
    <!-- @description
  This component displays search results as vertically centered cards within a parent container.
  Each card includes a round image aligned horizontally with the title and the author's name/source,
  both of which are vertically stacked. The component also features pagination centered at the bottom.
  While data is loading, a DaisyUI spinner is displayed in the center.
-->
    <!-- @responsive
  Visible only on desktop screens (lg and above). Hidden on mobile and tablet devices.
-->
    <!-- ========================================================================================= -->

    <section
      id="search-results-grid"
      class="lg:flex flex-col justify-between items-center relative min-h-[80vh]"
      role="region"
      aria-label="Search results section"
    >
      <!-- ======================== LOADING STATE ======================== -->
      <!-- @element LoadingIndicator -->
      <!-- @description
    Displays a centered DaisyUI spinner while search results are loading.
    Hidden once data is available.
  -->
      <!-- @state loading -->
      <div
        id="loading-indicator"
        class="hidden flex justify-center items-center flex-grow"
        role="status"
        aria-live="polite"
      >
        <span class="loading loading-spinner loading-lg text-primary"></span>
        <span class="sr-only">Loading search results...</span>
      </div>

      <!-- ======================== RESULTS GRID ======================== -->
      <!-- @element ResultsGrid -->
      <!-- @description
    Displays the search results as vertically aligned cards within the container.
    Each card content is horizontally centered and aligned from the top of the parent container.
  -->
      <div
        id="results-grid"
        class="flex flex-col justify-start items-center flex-grow w-full gap-6 mt-2 p-6"
        role="list"
        aria-label="Search results"
      >
        <!-- ======================== CARD ITEM ======================== -->
        <!-- @element ResultCard -->
        <!-- @description
      Represents a single search result item. The card displays a round image aligned horizontally
      with the title and author/source, both stacked vertically beside the image.
      The card remains centered horizontally and aligned from the top of the container.
    -->
        <article
          class="card bg-base-100 shadow-md hover:shadow-lg transition-shadow duration-200 w-full max-w-3xl"
          role="listitem"
        >
          <div class="card-body flex flex-row items-center gap-4 p-4">
            <!-- Thumbnail -->
            <figure class="shrink-0">
              <img
                src="https://images.unsplash.com/photo-1482049016688-2d3e1b311543?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=710"
                alt="Result thumbnail"
                class="rounded-full w-20 h-20 object-cover"
                loading="lazy"
              />
            </figure>

            <!-- Text Content -->
            <div class="flex flex-col justify-center">
              <h2 class="card-title text-base font-semibold line-clamp-2">
                Example Result Title Goes Here
              </h2>
              <p class="text-sm text-gray-500">by Author or Source</p>
            </div>
          </div>
        </article>

        <!-- @note Repeat ResultCard dynamically based on search results. -->
      </div>

      <!-- ======================== PAGINATION ======================== -->
      <!-- @element PaginationControls -->
      <!-- @description
    Displays pagination controls centered horizontally and vertically
    at the bottom of the parent container. Stays fixed at the bottom area
    without overlapping or covering other elements.
  -->
      <nav
        id="pagination-controls"
        class="absolute bottom-0 left-0 right-0 flex justify-center items-center py-6"
        role="navigation"
        aria-label="Pagination"
      >
        <div class="join">
          <button class="join-item btn btn-outline" aria-label="Previous page">«</button>
          <button class="join-item btn btn-outline btn-active" aria-current="page">1</button>
          <button class="join-item btn btn-outline">2</button>
          <button class="join-item btn btn-outline">3</button>
          <button class="join-item btn btn-outline" aria-label="Next page">»</button>
        </div>
      </nav>
    </section>
  </body>
</html>
